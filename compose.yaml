services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polymer_ai
      POSTGRES_USER: polymer_ai
      # Development-only credential. Override through a non-committed .env if needed.
      POSTGRES_PASSWORD: polymer_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymer_ai -d polymer_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
